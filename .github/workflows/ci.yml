name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://support:support@localhost:5432/support
  RABBITMQ_URL: amqp://support:support@localhost:5672/
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Нижняя граница из pyproject.toml и версия, на которой идёт разработка.
        python-version: ["3.11", "3.14"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support -d support"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4
        env:
          RABBITMQ_DEFAULT_USER: support
          RABBITMQ_DEFAULT_PASS: support
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      # Без инфраструктуры интеграционные тесты не пропускаются, а падают:
      # иначе сломанный стенд давал бы зелёную сборку.
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Плагин превращает упавшие тесты в аннотации: их видно на странице
      # прогона без входа в GitHub и без скачивания логов.
      - run: pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - name: Версии зависимостей
        run: pip freeze
      - name: Миграции применяются на чистую базу
        run: python -m alembic upgrade head
      - name: Миграции совпадают с моделями
        run: python -m alembic check
      - name: Тесты (unit + integration)
        run: python -m pytest -rs

  eval:
    # Гейт качества из раздела «Методика оценки». Пока LLM-провайдер не
    # подключён, проверяются метрики безопасности (NFR10 и автоответы на
    # неоднозначные обращения): они держатся архитектурой, а не моделью.
    # Полный отчёт, включая NFR2, сохраняется артефактом.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support -d support"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: python -m scripts.seed_kb
      - run: python -m scripts.index_kb --provider hashing
      - name: Eval на golden set (гейт по метрикам безопасности)
        run: python -m scripts.eval --rag-threshold 0.15 --gate --gate-metrics safety
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-report
          path: eval/report.json

  alerts:
    # Алерты из раздела «Наблюдаемость»: синтаксис правил и юнит-тесты на
    # синтетических рядах - алерт, который никогда не срабатывает, хуже его отсутствия.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Конфиг и правила Prometheus
        run: >-
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/cfg"
          prom/prometheus:v3.5.0 check config /cfg/prometheus.yml
      - name: Юнит-тесты алертов
        run: >-
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/cfg" -w /cfg
          prom/prometheus:v3.5.0 test rules alerts_test.yml

  demo:
    # Обещание README «стенд одной командой» проверяется на чистой машине при
    # каждом push: сборка образа, init, демо-тикеты, эскалации дошли до очереди.
    runs-on: ubuntu-latest
    env:
      DEMO_PORT: "8000"
    steps:
      - uses: actions/checkout@v5
      - name: Стенд с нуля
        run: docker compose --profile demo up -d --build
      - name: Инициализация и демо-тикеты завершились успешно
        # Не `docker compose wait`: он не находит уже завершившиеся контейнеры.
        run: |
          for svc in init demo; do
            for i in $(seq 1 60); do
              id=$(docker compose --profile demo ps -a -q --status exited "$svc")
              [ -n "$id" ] && break
              sleep 2
            done
            code=$(docker inspect -f '{{.State.ExitCode}}' "$id")
            echo "$svc: exit $code"
            [ "$code" = "0" ]
          done
      - name: API отвечает, ссылка для входа напечатана
        run: |
          curl -fsS http://localhost:8000/health
          docker compose --profile demo logs --no-log-prefix demo             | grep -o 'http://localhost:8000/console/#token=[^ ]*' > link.txt
          test -s link.txt
      - name: Эскалации в очереди консоли
        run: |
          token=$(sed 's/.*#token=//' link.txt)
          count=$(curl -fsS -H "Authorization: Bearer $token" http://localhost:8000/api/v1/escalations             | python3 -c 'import sys, json; print(len(json.load(sys.stdin)["items"]))')
          echo "в очереди: $count"; [ "$count" -ge 4 ]
      - name: События прошли outbox → RabbitMQ → consumer
        # Очередь консоли читается из Postgres и доставку не доказывает; запись в
        # consumed_events создаёт только consumer, получивший сообщение из брокера.
        run: |
          for i in $(seq 1 30); do
            consumed=$(docker compose exec -T postgres psql -U support -d support -tAc               "select count(*) from consumed_events")
            [ "$consumed" -ge 4 ] && echo "обработано consumer'ом: $consumed" && exit 0
            sleep 2
          done
          echo "consumer обработал только: $consumed"; exit 1
      - name: Логи стенда при падении
        if: failure()
        run: docker compose --profile demo logs --no-color | tail -n 200

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - name: Проверка типов и сборка
        run: npm run build
