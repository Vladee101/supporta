[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Устанавливается только пакет app. scripts/, migrations/ и tests/ запускаются
# из корня репозитория (python -m scripts.seed_kb) и в дистрибутив не входят.
[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "support-agent"
version = "0.1.0"
description = "AI-агент службы поддержки: классификация, RAG, детерминированная маршрутизация"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    # Граф агента (ADR-002).
    "langgraph>=1.0",
    # RabbitMQ (ADR-003). Синхронный клиент: поллер держит блокировку строки
    # outbox на время публикации, мост в API живёт в отдельном потоке.
    "pika>=1.3",
    # HTTP-клиент адаптеров LLM-провайдеров (ADR-009).
    "httpx>=0.28",
]

[project.optional-dependencies]
# Self-hosted embedding (ADR-006). Тянет torch, поэтому вынесено отдельно.
embeddings = ["sentence-transformers>=3.3"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: требует запущенного Postgres (отдельная база support_test)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Миграция сгенерирована из metadata - длину строк в ней не форматируем вручную.
"migrations/versions/*.py" = ["E501"]
# Генератор отчёта по NFR: длинные строки - это текст отчёта, а не код.
"scripts/nfr_report.py" = ["E501"]
