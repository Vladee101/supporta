services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support
    ports:
      # Порт хоста вынесен в переменную: на машине разработчика 5432 часто занят
      # локально установленным PostgreSQL, и соединение уходит в него, а не в контейнер.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: support
      RABBITMQ_DEFAULT_PASS: support
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # SLI и алерты (раздел «Наблюдаемость», docs/runbook.md). Отдельный профиль:
  # docker compose --profile observability up -d  → http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      # API работает на хосте; на Linux host.docker.internal нужно объявить явно.
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
